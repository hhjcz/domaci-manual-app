---
# Publishing prebuilt images is optional. Until it is used, the Supervisor
# builds the app on the user's device at install time.
#
# To switch to prebuilt images, add this line to domaci_manual/config.yaml and
# run this workflow:
#
#   image: ghcr.io/hhjcz/{arch}-addon-domaci-manual
#
# The Supervisor substitutes {arch} and appends `:<version>` from config.yaml,
# which is exactly what this workflow pushes.
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }} image
    runs-on: ${{ matrix.runs-on }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-domaci-manual
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "aarch64"]
        include:
          - runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the base image and app version
        id: meta
        run: |
          build_from=$(sed -n 's/^  ${{ matrix.arch }}: *//p' domaci_manual/build.yaml)
          version=$(sed -n 's/^version: *"\?\([^"]*\)"\?$/\1/p' domaci_manual/config.yaml)
          test -n "$build_from" && test -n "$version"
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: domaci_manual
          push: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.build_from }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
