---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: domaci_manual/Dockerfile
          config: .hadolint.yaml
      - name: YAMLLint
        uses: frenck/action-yamllint@v1.5
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1008 -s bash -x
        with:
          # s6 service scripts use a bashio shebang the action cannot detect.
          additional_files: run finish

  image:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "aarch64"]
        include:
          - runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Each architecture builds on its own native runner, so no emulation is
      # needed. build.yaml stays the single source of truth for base images.
      - name: Resolve the base image
        id: base
        run: |
          build_from=$(sed -n 's/^  ${{ matrix.arch }}: *//p' domaci_manual/build.yaml)
          test -n "$build_from"
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: domaci_manual
          push: false
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
